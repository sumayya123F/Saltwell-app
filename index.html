<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanTree</title>
  <meta name="theme-color" content="#2f6f4f">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="wrap bar">
      <span class="brand"><svg class="logo" viewBox="0 0 32 32" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g transform="rotate(-38 16 16)"><path d="M11.5 3v6.5a4.5 4.5 0 0 0 9 0V3M16 3v7M16 14.5V29"/></g><g transform="rotate(38 16 16)"><path d="M15 29V3c4 2.5 6 7 6 12h-6"/></g></svg> PanTree</span>
      <input id="search" type="search" placeholder="Search recipes or ingredients">
      <div class="tabs">
        <button id="tHome" aria-pressed="true">Browse</button>
        <button id="tFav" aria-pressed="false">Favorites <span id="favn">0</span></button>
      </div>
      <button id="theme" class="btn" aria-label="Switch light or dark">Theme</button>
    </div>
  </header>

  <main class="wrap">
    <h2 id="heading">Browse recipes</h2>
    <p id="empty" hidden>No recipes found. Try another search.</p>
    <ul id="list" class="grid"></ul>
  </main>

  <button id="add" class="fab" hidden>+ Add recipe</button>
  <footer><button id="owner" class="link">Owner sign in</button></footer>

  <dialog id="form-dialog">
    <form id="form" method="dialog">
      <h2 id="form-title">New recipe</h2>
      <label>Name <input id="f-name" required></label>
      <label>Category <small>(like Dessert or Soup)</small>
        <input id="f-category" list="dl-categories" placeholder="Dessert"></label>
      <label>Cuisine <small>(like Indonesian)</small>
        <input id="f-area" list="dl-areas" placeholder="Indonesian"></label>
      <label>YouTube link <small>(optional)</small>
        <input id="f-video" type="url" inputmode="url" placeholder="https://youtu.be/..."></label>
      <datalist id="dl-categories"></datalist>
      <datalist id="dl-areas"></datalist>
      <fieldset>
        <legend>Ingredients</legend>
        <div id="f-ingredients" class="rows"></div>
        <button type="button" id="add-ingredient" class="small">+ Add ingredient</button>
      </fieldset>
      <fieldset>
        <legend>Steps</legend>
        <div id="f-steps" class="rows"></div>
        <button type="button" id="add-step" class="small">+ Add step</button>
      </fieldset>
      <div class="row">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="view-dialog" class="full">
    <div class="topbar">
      <button id="back" aria-label="Back to recipes">← Back</button>
      <button id="fav-detail" aria-pressed="false">♡ Save</button>
    </div>
    <article id="view">
      <div class="hero">
        <div id="view-head" class="hero-text"></div>
        <div id="view-cover" class="thumb"></div>
      </div>
      <div id="view-body"></div>
    </article>
    <div class="row actions">
      <button id="delete" class="danger">Delete</button>
      <button id="edit">Edit</button>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
