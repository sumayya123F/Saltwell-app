<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pong</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>PONG</h1>
    <div class="wrap">
      <canvas id="game" width="800" height="500"></canvas>
      <div id="overlay">
        <p id="msg">Press <b>Space</b> to start</p>
        <p class="hint">W / S or ↑ / ↓ to move · P to pause · drag/touch to move on mobile</p>
      </div>
    </div>
  </main>
  <script src="game.js"></script>
</body>
</html>
